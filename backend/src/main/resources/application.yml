spring:
  application:
    name: routick

  datasource:
    url: jdbc:postgresql://localhost:5432/routick
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    defer-datasource-initialization: true   # data.sql? ??? ?? ??? ??

  sql:
    init:
      mode: always                          # ??? ??? data.sql ??

  data:
    redis:
      host: localhost
      port: 6379

agent:
  base-url: http://localhost:8000
  mock: false